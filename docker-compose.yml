# Local/dev Docker Compose for the Livestock Management System.
#
# NOTE ON CONTAINER NAMES: earlier versions of this file pinned fixed global
# container names (livestock_postgres_db / livestock_app_backend). Fixed
# names collide across unrelated projects on the same machine (Docker
# container names must be globally unique), which is exactly what happened
# here — this machine already had another project's Postgres container using
# that name. The names below are intentionally left unset so Compose falls
# back to its default project-scoped naming
# (<project>-db-1 / <project>-app-1, derived from this folder's name or
# COMPOSE_PROJECT_NAME), which can never collide with another project.
#
# If you already have a database container running locally for this project
# under the old fixed name, this file will no longer manage it — `docker
# compose up -d db` will create a NEW, separate, empty Postgres container
# instead of reusing it. Point DB_HOST/DB_PORT in .env at whichever instance
# actually holds the data you want to use.

services:
  # 1. PostgreSQL Relational Database Service
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_DB: ${DB_NAME:-livestock_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks:
      - livestock_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-livestock_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # 2. Livestock Backend & Next.js Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      PORT: 3001
      CORS_ORIGIN: "*"
      # Use the Docker Compose service name 'db' as the database host
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      DB_NAME: ${DB_NAME:-livestock_db}
      DB_SSL: "false"
      DB_POOL_MIN: 2
      DB_POOL_MAX: 20
      DB_IDLE_TIMEOUT_MS: 30000
      DB_CONN_TIMEOUT_MS: 5000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - livestock_net

networks:
  livestock_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
